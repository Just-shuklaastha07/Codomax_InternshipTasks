<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inkly | Write a Blog</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- Navigation Bar -->

    <nav class="navbar">

        <div class="logo">
            Inkly
        </div>

        <ul>

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="addBlog.html">
                    Add Blog
                </a>
            </li>

        </ul>

    </nav>


    <!-- Add Blog Section -->

    <main class="add-blog-page">

        <div class="form-box">

            <div class="form-heading">

                <p class="small-heading">
                    YOUR STORY
                </p>

                <h1>
                    Write something worth reading.
                </h1>

                <p>
                    Put your thoughts into words and share them with the world.
                </p>

            </div>


            <form id="blogForm">

                <!-- Blog Title -->

                <label for="title">
                    Blog Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Give your story a title..."
                >


                <!-- Author -->

                <label for="author">
                    Author Name
                </label>

                <input
                    type="text"
                    id="author"
                    placeholder="Enter your name..."
                >


                <!-- Blog Content -->

                <label for="content">
                    Blog Content
                </label>

                <textarea
                    id="content"
                    rows="10"
                    placeholder="Start writing your story..."
                ></textarea>


                <!-- Submit -->

                <button
                    type="submit"
                    class="publish-btn"
                >
                    Publish Story
                </button>

            </form>


            <!-- Message -->

            <p id="message"></p>

        </div>

    </main>


    <!-- Footer -->

    <footer>

        <div class="footer-logo">
            Inkly
        </div>

        <p>
            Write. Share. Inspire.
        </p>

        <p class="copyright">
            © 2026 Inkly | Created by Astha
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
